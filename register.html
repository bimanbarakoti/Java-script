<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-box">
    <h2>Create an Account</h2>
    <nav class="nav-links">
      <a href="index.html">Login</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Jane Doe">
        <small class="error" id="fullnameError"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="jane@example.com">
        <small class="error" id="emailError"></small>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="text" id="age" name="age" placeholder="18">
        <small class="error" id="ageError"></small>
      </div>

      <div class="field">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="regPassword" placeholder="At least 6 characters">
        <small class="error" id="regPasswordError"></small>
      </div>

      <div class="field">
        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="">Select a role</option>
          <option value="Member">Member</option>
          <option value="Admin">Admin</option>
          <option value="Guest">Guest</option>
        </select>
        <small class="error" id="roleError"></small>
      </div>

      <button type="submit">Create Account</button>
      <p id="formMessage"></p>
    </form>
  </div>

  <script src="app.js"></script>
  <script src="register.js"></script>
</body>
</html>
